<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    The marketing site's tab icon.

    REPLACED 2026-08-30. Until then this file was the REACT ROUTER STARTER
    TEMPLATE'S LOGO, in React Router red (#F44250) on near black, and it had
    been serving from usesessionly.com since February. The apex of a children's
    program product was showing another project's mark in every browser tab,
    every bookmark and every link preview, and nothing pointed at it because a
    favicon is the one asset nobody looks at again after the first day.

    THE RENDERED CONTENT IS BYTE-IDENTICAL to web-intake/app/icon.svg and
    web-console/app/icon.svg in the Sessionly repo once XML comments are
    stripped. Those two are held together by icon-sync.test.ts. This third copy
    lives in a different repository and NOTHING TESTS IT, which is the same
    position the brand palette was in while it drifted for six months. If you
    change a coordinate here, change it in all three.

    The mark is the Brand v2 sage gradient with the cream Sessionly S, tuned for
    small rendering: the glyph fills about 62% of the square rather than the app
    icon's 22%, because the app icon's padding exists for iOS and Android
    masking that a browser tab does not apply.

    NOTE for whoever edits this comment: an XML comment may not contain a
    double hyphen. The repo convention of writing a double hyphen where prose
    wants a dash is ILLEGAL here and makes the whole file fail to parse, which
    presents as a broken image rather than as an error anywhere.
  -->
  <defs>
    <linearGradient id="frame" x1="32.9%" y1="3%" x2="67.1%" y2="97%">
      <stop offset="0%" stop-color="#5A8A72"/>
      <stop offset="100%" stop-color="#2E4A3C"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#frame)"/>
  <g transform="translate(-8 -7.7) scale(1.25)">
    <path d="M40 22 Q40 17 33 17 L26 17 Q19 17 19 23 Q19 29 26 29 L38 29 Q45 29 45 35 Q45 41 38 41 L31 41 Q24 41 24 47"
          stroke="#F4EFE6" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="22" cy="46.5" r="2.5" fill="#F4EFE6"/>
  </g>
</svg>
